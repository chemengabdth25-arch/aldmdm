<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدمدم | Al-Damdam AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary: #1e3a8a; --secondary: #0ea5e9; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.7; }
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; text-align: center; padding: 2.2rem 1rem 1.8rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
        .lang-btn { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.9rem; }
        [dir="ltr"] .lang-btn { left: auto; right: 15px; }
        header h1 { margin: 0; font-size: 2.3rem; font-weight: 800; }
        header p { margin: 0.5rem 0 0; opacity: 0.95; font-size: 1.05rem; }
        .container { max-width: 960px; margin: 1.8rem auto; padding: 0 1rem; }
        .card { background: var(--card); border-radius: 16px; padding: 1.6rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
        .tab-btn { padding: 12px 10px; border: 2px solid #e2e8f0; background: white; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.95rem; color: var(--text); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .upload-box { border: 2px dashed var(--secondary); border-radius: 12px; padding: 1.4rem; text-align: center; background: #f0f9ff; margin-bottom: 1rem; cursor: pointer; }
        .file-badge { display: inline-block; background: #dbeafe; color: #1e3a8a; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-top: 8px; }
        textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; margin-top: 8px; margin-bottom: 1rem; background: white; }
        .action-btn { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; width: 100%; }
        .action-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-group { display: flex; gap: 10px; margin-top: 1rem; flex-wrap: wrap; }
        .pdf-btn { background: #059669; flex: 1; min-width: 180px; }
        .copy-btn { background: #0284c7; flex: 1; min-width: 180px; }
        .progress-container { display: none; margin-top: 1.2rem; background: #f1f5f9; padding: 1rem; border-radius: 12px; border: 1px solid #cbd5e1; }
        .progress-bar-bg { width: 100%; height: 12px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin: 8px 0; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.4s ease; }
        .progress-text { font-weight: 700; color: var(--primary); font-size: 0.95rem; text-align: center; }
        #result-area { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.6rem; margin-top: 1.5rem; overflow-x: auto; }
        #result-area h1, #result-area h2, #result-area h3 { color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; margin-top: 1.4rem; }
        #result-area table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        #result-area th, #result-area td { border: 1px solid #cbd5e1; padding: 10px; text-align: start; }
        #result-area th { background: #f1f5f9; }
        footer { text-align: center; padding: 1.5rem; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">🌐 English</button>
    <h1 id="headerTitle">🎓 الدمدم</h1>
    <p id="headerSub">محرك أكاديمي متكامل للطلاب — معالجة الملازم الضخمة، ترجمة، تلخيص، تقارير، وعروض تقديمية</p>
</header>

<div class="container">
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" id="tabTranslate" onclick="setMode('translate', this)">🌐 ترجمة ملزمة</button>
            <button class="tab-btn" id="tabSummarize" onclick="setMode('summarize', this)">📝 تلخيص ذكي</button>
            <button class="tab-btn" id="tabReport" onclick="setMode('report', this)">📄 إنشاء تقرير</button>
            <button class="tab-btn" id="tabSlides" onclick="setMode('slides', this)">📊 عرض تقديمي</button>
        </div>

        <label id="outLangLabel"><strong>🗣️ لغة النتيجة المطلوبة:</strong></label>
        <select id="outputLang">
            <option value="ar">العربية الأكاديمية (مع إبقاء المصطلحات العلمية بالإنجليزية)</option>
            <option value="en">Academic English (لغة إنجليزية أكاديمية رصينة)</option>
        </select>

        <div id="pdf-section">
            <div class="upload-box" onclick="document.getElementById('pdfInput').click()">
                <div id="uploadText">📂 <strong>اضغط هنا لرفع ملزمة أو عدة ملازم PDF دفعة واحدة</strong> (حتى 100+ صفحة)</div>
                <div id="fileStats" class="file-badge" style="display:none;"></div>
                <input type="file" id="pdfInput" accept="application/pdf" multiple style="display:none" onchange="extractPDFs(event)">
            </div>
        </div>

        <label id="input-label"><strong>النص أو محتوى الملازم:</strong></label>
        <textarea id="userInput" rows="7" placeholder="ارفع ملف PDF واحد أو عدة ملفات من الأعلى، أو الصق النص هنا..."></textarea>

        <button class="action-btn" id="runBtn" onclick="processAI()">🚀 ابدأ المعالجة الشاملة الآن</button>

        <div class="progress-container" id="progressBox">
            <div class="progress-text" id="progressText">⏳ جاري تجهيز محرك الدمدم...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>

        <div id="result-wrapper" style="display:none;">
            <div id="result-area"></div>
            <div class="btn-group">
                <button class="action-btn copy-btn" id="copyBtn" onclick="copyResult()">📋 نسخ النتيجة كاملة</button>
                <button class="action-btn pdf-btn" id="pdfBtn" onclick="downloadPDF()">📥 تحميل النتيجة كملف PDF</button>
            </div>
        </div>
    </div>
</div>

<footer id="footerText">صُنع بحب لخدمة الطلاب مجاناً ❤️ | منصة الدمدم</footer>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let currentMode = 'translate';
    let uiLang = 'ar';
    let rawMarkdownOutput = '';

    const translations = {
        ar: {
            toggleBtn: '🌐 English', title: '🎓 الدمدم',
            sub: 'محرك أكاديمي متكامل للطلاب — معالجة الملازم الضخمة، ترجمة، تلخيص، تقارير، وعروض تقديمية',
            tabTranslate: '🌐 ترجمة ملزمة', tabSummarize: '📝 تلخيص ذكي', tabReport: '📄 إنشاء تقرير', tabSlides: '📊 عرض تقديمي',
            outLangLabel: '<strong>🗣️ لغة النتيجة المطلوبة:</strong>',
            uploadText: '📂 <strong>اضغط هنا لرفع ملزمة أو عدة ملازم PDF دفعة واحدة</strong> (حتى 100+ صفحة)',
            runBtn: '🚀 ابدأ المعالجة الشاملة الآن', pdfBtn: '📥 تحميل النتيجة كملف PDF', copyBtn: '📋 نسخ النتيجة كاملة',
            footer: 'صُنع بحب لخدمة الطلاب مجاناً ❤️ | منصة الدمدم',
            labels: {
                translate: '<strong>النص المراد ترجمته (أو ارفع ملفات PDF):</strong>',
                summarize: '<strong>المادة المراد تلخيصها (أو ارفع ملفات PDF):</strong>',
                report: '<strong>عنوان التقرير وتفاصيله (أو ارفع ملفات مرجعية PDF):</strong>',
                slides: '<strong>موضوع العرض التقديمي (أو ارفع ملزمة لتحويلها لشرائح):</strong>'
            },
            placeholders: {
                translate: 'ارفع ملازمك من الأعلى أو الصق النص الإنجليزي/العربي هنا...',
                summarize: 'ارفع ملازمك الطويلة من الأعلى وسنقوم بتقسيمها وتلخيصها بالكامل بدون أي انقطاع...',
                report: 'اكتب عنوان التقرير أو التجربة (مثل: التقطير التجزيئي للنفط الخام) أو ارفع ملف المادة...',
                slides: 'ارفع المحاضرة أو اكتب الموضوع لتحويله إلى شرائح عرض (Slides) احترافية جاهزة...'
            }
        },
        en: {
            toggleBtn: '🌐 عربي', title: '🎓 Al-Damdam',
            sub: 'All-in-One Academic Engine — Multi-PDF Processing, Translation, Summaries, Reports & Presentations',
            tabTranslate: '🌐 Translate Lecture', tabSummarize: '📝 Smart Summary', tabReport: '📄 Generate Report', tabSlides: '📊 Presentation Slides',
            outLangLabel: '<strong>🗣️ Output Language:</strong>',
            uploadText: '📂 <strong>Click here to upload one or multiple PDF lectures</strong> (100+ pages supported)',
            runBtn: '🚀 Start Full Processing Now', pdfBtn: '📥 Download Result as PDF', copyBtn: '📋 Copy Full Result',
            footer: 'Made with love to serve students for free ❤️ | Al-Damdam Platform',
            labels: {
                translate: '<strong>Text to Translate (or upload PDFs):</strong>',
                summarize: '<strong>Content to Summarize (or upload PDFs):</strong>',
                report: '<strong>Report Title & Details (or upload reference PDFs):</strong>',
                slides: '<strong>Presentation Topic (or upload lecture PDF to convert to slides):</strong>'
            },
            placeholders: {
                translate: 'Upload your PDF files above or paste text here...',
                summarize: 'Upload long lectures above — they will be automatically chunked and summarized without timeouts...',
                report: 'Enter report topic or experiment details, or upload reference material...',
                slides: 'Upload lecture notes or enter a topic to generate structured presentation slides...'
            }
        }
    };

    function toggleLanguage() {
        uiLang = uiLang === 'ar' ? 'en' : 'ar';
        const t = translations[uiLang];
        const html = document.getElementById('htmlTag');
        html.setAttribute('lang', uiLang);
        html.setAttribute('dir', uiLang === 'ar' ? 'rtl' : 'ltr');
        document.getElementById('langToggle').innerText = t.toggleBtn;
        document.getElementById('headerTitle').innerText = t.title;
        document.getElementById('headerSub').innerText = t.sub;
        document.getElementById('tabTranslate').innerText = t.tabTranslate;
        document.getElementById('tabSummarize').innerText = t.tabSummarize;
        document.getElementById('tabReport').innerText = t.tabReport;
        document.getElementById('tabSlides').innerText = t.tabSlides;
        document.getElementById('outLangLabel').innerHTML = t.outLangLabel;
        document.getElementById('uploadText').innerHTML = t.uploadText;
        document.getElementById('runBtn').innerText = t.runBtn;
        document.getElementById('pdfBtn').innerText = t.pdfBtn;
        document.getElementById('copyBtn').innerText = t.copyBtn;
        document.getElementById('footerText').innerText = t.footer;
        document.getElementById('outputLang').value = uiLang;
        updateModeTexts();
    }

    function updateModeTexts() {
        const t = translations[uiLang];
        document.getElementById('input-label').innerHTML = t.labels[currentMode];
        document.getElementById('userInput').placeholder = t.placeholders[currentMode];
    }

    function setMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateModeTexts();
    }

    async function extractPDFs(event) {
        const files = Array.from(event.target.files);
        if (!files.length) return;
        const statsBadge = document.getElementById('fileStats');
        statsBadge.style.display = 'inline-block';
        statsBadge.innerText = uiLang === 'ar' ? `⏳ جاري قراءة ${files.length} ملف(ات)...` : `⏳ Reading ${files.length} file(s)...`;
        let combinedText = '';
        let totalPages = 0;

        for (const file of files) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
            totalPages += pdf.numPages;
            combinedText += `\n=== [ملف / File: ${file.name}] ===\n\n`;
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageText = content.items.map(item => item.str).join(' ');
                combinedText += `--- Page ${i} ---\n${pageText}\n\n`;
            }
        }
        document.getElementById('userInput').value = combinedText.trim();
        statsBadge.innerText = uiLang === 'ar' ? `✅ تم استخراج ${totalPages} صفحة من ${files.length} ملف بنجاح` : `✅ Extracted ${totalPages} pages from ${files.length} file(s)`;
    }

    function splitTextIntoChunks(text, maxChunkSize = 5500) {
        if (text.length <= maxChunkSize) return [text];
        const paragraphs = text.split(/\n\s*\n/);
        const chunks = [];
        let currentChunk = '';
        for (const para of paragraphs) {
            if ((currentChunk.length + para.length) > maxChunkSize && currentChunk.length > 0) {
                chunks.push(currentChunk.trim());
                currentChunk = para + '\n\n';
            } else {
                currentChunk += para + '\n\n';
            }
        }
        if (currentChunk.trim()) chunks.push(currentChunk.trim());
        return chunks;
    }

    function getPromptsForChunk(chunkText, outLang, chunkIndex, totalChunks) {
        const partTag = totalChunks > 1 ? ` (الجزء ${chunkIndex + 1} من ${totalChunks})` : '';
        let systemInstruction = '';
        let prompt = '';
        if (outLang === 'ar') {
            systemInstruction = 'أنت بروفيسور جامعي ومترجم وباحث أكاديمي خبير. مهمتك مساعدة الطالب الجامعي بأعلى دقة علمية وتنظيم بصري باستخدام Markdown (عناوين، نقاط، جداول، معادلات). لا تختصر المعلومات المهمة ولا تترك أي فقرة بدون معالجة.';
            if (currentMode === 'translate') prompt = `ترجم الجزء التالي${partTag} إلى اللغة العربية الفصحى الأكاديمية الواضحة، مع إبقاء جميع المصطلحات العلمية والهندسية والطبية بالإنجليزية بين قوسين بجانب ترجمتها، والحفاظ على القوانين والمعادلات كما هي:\n\n${chunkText}`;
            else if (currentMode === 'summarize') prompt = `لخص وشرح الجزء التالي${partTag} للطالب بأسلوب أكاديمي شامل ومنظم يشمل: (1. الأفكار الرئيسية، 2. التعاريف والمصطلحات مع الإنجليزية بين قوسين، 3. القوانين والخطوات، 4. أسئلة اختبار متوقعة مع أجوبتها):\n\n${chunkText}`;
            else if (currentMode === 'report') prompt = `اكتب تقريراً جامعياً أكاديمياً متكاملاً ومفصلاً${partTag} حول المحتوى/الموضوع التالي باللغة العربية (مع المصطلحات الإنجليزية بين قوسين)، شاملاً: العنوان، المقدمة، الجانب النظري ومبدأ العمل، الخطوات/التطبيقات، المناقشة، والاستنتاجات:\n\n${chunkText}`;
            else if (currentMode === 'slides') prompt = `حوّل المحتوى التالي${partTag} إلى عرض تقديمي (PowerPoint Slides) احترافي جاهز للعرض الجامعي. قسّم المحتوى إلى شرائح مرقمة (Slide 1, Slide 2...)، واذكر لكل شريحة: [عنوان الشريحة]، [النقاط المختصرة للعرض]، و[ملاحظات المتحدث للشرح التفصيلي]:\n\n${chunkText}`;
        } else {
            systemInstruction = 'You are an expert university professor, academic translator, and researcher. Deliver thorough, highly accurate, well-structured Markdown output (headings, bullet points, tables, formulas) without skipping technical details.';
            if (currentMode === 'translate') prompt = `Translate the following section${partTag} into formal, clear academic English while preserving all scientific terminology, formulas, and technical accuracy:\n\n${chunkText}`;
            else if (currentMode === 'summarize') prompt = `Create a comprehensive, structured academic study guide and summary for this section${partTag} covering: (1. Core Concepts, 2. Key Definitions, 3. Formulas & Procedures, 4. Practice Exam Questions with Answers):\n\n${chunkText}`;
            else if (currentMode === 'report') prompt = `Write a comprehensive, publication-grade academic university report${partTag} based on the following topic/material, including: Title, Abstract, Theoretical Background, Methodology/Applications, Discussion, and Conclusion:\n\n${chunkText}`;
            else if (currentMode === 'slides') prompt = `Convert the following material${partTag} into a structured, ready-to-present university PowerPoint deck. Format as numbered slides (Slide 1, Slide 2...) with: [Slide Title], [Concise Bullet Points], and [Speaker Notes]:\n\n${chunkText}`;
        }
        return { systemInstruction, prompt };
    }

    async function callServerWithRetry(prompt, systemInstruction, retries = 2) {
        for (let attempt = 0; attempt <= retries; attempt++) {
            try {
                const response = await fetch('/.netlify/functions/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, systemInstruction })
                });
                const textResponse = await response.text();
                let data;
                try { data = JSON.parse(textResponse); }
                catch { throw new Error('استجابة غير مكتملة من السيرفر، جاري إعادة المحاولة تلقائياً...'); }
                if (!response.ok || data.error) throw new Error(data.error || 'خطأ مؤقت في الخادم');
                return data.output;
            } catch (err) {
                if (attempt === retries) throw err;
                await new Promise(r => setTimeout(r, 1500));
            }
        }
    }

    async function processAI() {
        const text = document.getElementById('userInput').value.trim();
        const outLang = document.getElementById('outputLang').value;
        if (!text) { alert(uiLang === 'ar' ? 'يرجى إدخال النص أو رفع ملفات PDF أولاً!' : 'Please enter text or upload PDF files first!'); return; }

        const runBtn = document.getElementById('runBtn');
        const progressBox = document.getElementById('progressBox');
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const resultWrapper = document.getElementById('result-wrapper');
        const resultArea = document.getElementById('result-area');

        runBtn.disabled = true;
        progressBox.style.display = 'block';
        resultWrapper.style.display = 'block';
        resultArea.innerHTML = '';
        rawMarkdownOutput = '';
        resultArea.style.direction = outLang === 'ar' ? 'rtl' : 'ltr';
        resultArea.style.textAlign = outLang === 'ar' ? 'right' : 'left';

        const chunks = splitTextIntoChunks(text, 5500);
        const totalChunks = chunks.length;

        try {
            for (let i = 0; i < totalChunks; i++) {
                const percent = Math.round((i / totalChunks) * 100);
                progressFill.style.width = `${Math.max(percent, 8)}%`;
                progressText.innerText = uiLang === 'ar'
                    ? `⏳ جاري معالجة الجزء (${i + 1} من ${totalChunks}) بدقة أكاديمية عالية... يظهر الناتج بالأسفل تباعاً`
                    : `⏳ Processing part (${i + 1} of ${totalChunks}) with high academic precision...`;
                const { systemInstruction, prompt } = getPromptsForChunk(chunks[i], outLang, i, totalChunks);
                const chunkOutput = await callServerWithRetry(prompt, systemInstruction, 2);
                rawMarkdownOutput += (i > 0 ? '\n\n---\n\n' : '') + chunkOutput;
                resultArea.innerHTML = marked.parse(rawMarkdownOutput);
            }
            progressFill.style.width = '100%';
            progressText.innerText = uiLang === 'ar' ? `✅ اكتملت معالجة جميع الأجزاء (${totalChunks}/${totalChunks}) بنجاح تام!` : `✅ All (${totalChunks}/${totalChunks}) parts processed successfully!`;
        } catch (err) {
            progressText.innerText = (uiLang === 'ar' ? '⚠️ توقف مؤقت: ' : '⚠️ Stopped: ') + err.message;
        } finally {
            runBtn.disabled = false;
        }
    }

    function copyResult() {
        navigator.clipboard.writeText(rawMarkdownOutput).then(() => {
            alert(uiLang === 'ar' ? '✅ تم نسخ النتيجة كاملة إلى الحافظة!' : '✅ Full result copied to clipboard!');
        });
    }

    function downloadPDF() {
        const element = document.getElementById('result-area');
        html2pdf().set({ margin: 12, filename: 'Aldamdam_Academic_Output.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).save();
    }
</script>
</body>
</html>
