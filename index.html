<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدمدم | Al-Damdam AI</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Tahoma, Arial, sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding: 16px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; padding: 24px; border-radius: 16px; margin-bottom: 18px; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
    header h1 { margin: 0 0 8px; font-size: 24px; }
    header p { margin: 0; opacity: .92; font-size: 15px; }
    .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    label { font-weight: bold; display: block; margin: 14px 0 6px; font-size: 14px; color: #334155; }
    select, input[type=file], textarea { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; font-family: inherit; }
    textarea { min-height: 160px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 16px; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .actions { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    #copyBtn { background: #0f172a; margin-top: 0; }
    #dlBtn { background: #15803d; margin-top: 0; }
    #status { margin-top: 14px; font-weight: bold; color: #1e40af; text-align: center; font-size: 15px; }
    #result { white-space: pre-wrap; line-height: 1.85; font-size: 15.5px; color: #1e293b; }
    .hint { font-size: 13px; color: #64748b; margin-top: 4px; }
    @media (max-width: 540px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎓 الدمدم | Al-Damdam AI</h1>
      <p>ترجمة الملازم الجامعية، تلخيص المحاضرات، وصناعة التقارير الأكاديمية بأعلى دقة</p>
    </header>

    <div class="card">
      <div class="row">
        <div>
          <label for="mode">نوع العملية:</label>
          <select id="mode">
            <option value="translate">ترجمة الملزمة بالكامل</option>
            <option value="summarize">تلخيص شامل ومنظم</option>
            <option value="report">تحويل إلى تقرير أكاديمي</option>
          </select>
        </div>
        <div>
          <label for="lang">لغة المخرجات:</label>
          <select id="lang">
            <option value="ar">العربية الفصحى (مع المصطلحات الإنجليزية)</option>
            <option value="en">الإنجليزية الأكاديمية</option>
          </select>
        </div>
      </div>

      <label for="pdfFile">رفع ملف الملزمة (PDF حتى 50 ميغابايت):</label>
      <input type="file" id="pdfFile" accept="application/pdf">
      <div class="hint">يدعم الملازم الكبيرة والطويلة بالمعالجة السحابية دون انقطاع.</div>

      <label for="textInput">أو الصق النص مباشرة هنا (اختياري):</label>
      <textarea id="textInput" placeholder="الصق نص المحاضرة هنا إذا لم ترفع ملف PDF..."></textarea>

      <button id="runBtn" onclick="startProcess()">ابدأ المعالجة الآن</button>
      <div id="status"></div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <div id="result"></div>
      <div class="actions" id="actionBtns">
        <button id="copyBtn" onclick="copyResult()">نسخ النتيجة</button>
        <button id="dlBtn" onclick="downloadResult()">تحميل كملف نصي</button>
      </div>
    </div>
  </div>

  <script>
    async function startProcess() {
      const btn = document.getElementById("runBtn");
      const status = document.getElementById("status");
      const resultCard = document.getElementById("resultCard");
      const resultBox = document.getElementById("result");
      const actionBtns = document.getElementById("actionBtns");

      const file = document.getElementById("pdfFile").files[0];
      const text = document.getElementById("textInput").value.trim();
      const mode = document.getElementById("mode").value;
      const lang = document.getElementById("lang").value;

      if (!file && !text) {
        status.textContent = "يرجى اختيار ملف PDF أو لصق النص أولاً.";
        return;
      }

      btn.disabled = true;
      resultCard.style.display = "none";
      actionBtns.style.display = "none";

      try {
        let fileUri = null;
        let fileName = null;

        if (file) {
          status.textContent = "1/3 جاري تجهيز رابط الرفع الآمن للملزمة...";
          const startRes = await fetch("/.netlify/functions/upload-start", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              displayName: file.name,
              mimeType: file.type || "application/pdf",
              size: file.size
            })
          });
          const startData = await startRes.json();
          if (!startRes.ok) throw new Error(startData.error || "فشل بدء الرفع");

          status.textContent = "2/3 جاري رفع الملزمة إلى خادم الذكاء الاصطناعي...";
          const upRes = await fetch(startData.uploadUrl, {
            method: "POST",
            headers: {
              "X-Goog-Upload-Offset": "0",
              "X-Goog-Upload-Command": "upload, finalize"
            },
            body: file
          });
          if (!upRes.ok) throw new Error("فشل رفع الملف، تأكد من اتصال الإنترنت");
          const upData = await upRes.json();
          fileUri = upData.file.uri;
          fileName = upData.file.name;
        }

        const jobId = crypto.randomUUID();
        status.textContent = "3/3 جاري المعالجة الأكاديمية في الخلفية (قد يستغرق دقيقة للملازم الكبيرة)...";

        const bgRes = await fetch("/.netlify/functions/process-background", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ jobId, fileUri, fileName, text, mode, lang })
        });
        if (!bgRes.ok && bgRes.status !== 202) {
          throw new Error("تعذر بدء المعالجة في الخلفية");
        }

        while (true) {
          await new Promise(r => setTimeout(r, 3000));
          const pollRes = await fetch(`/.netlify/functions/job-status?jobId=${encodeURIComponent(jobId)}`);
          const pollData = await pollRes.json();

          if (pollData.status === "processing") {
            status.textContent = pollData.step || "جاري المعالجة...";
          } else if (pollData.status === "done") {
            status.textContent = "تمت المعالجة بنجاح!";
            resultBox.textContent = pollData.result;
            resultCard.style.display = "block";
            actionBtns.style.display = "grid";
            break;
          } else if (pollData.status === "error") {
            throw new Error(pollData.error || "حدث خطأ أثناء المعالجة");
          }
        }
      } catch (err) {
        status.textContent = "خطأ: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function copyResult() {
      const text = document.getElementById("result").textContent;
      navigator.clipboard.writeText(text);
      document.getElementById("copyBtn").textContent = "تم النسخ ✓";
      setTimeout(() => document.getElementById("copyBtn").textContent = "نسخ النتيجة", 2000);
    }

    function downloadResult() {
      const text = document.getElementById("result").textContent;
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Al-Damdam-Result.txt";
      a.click();
    }
  </script>
</body>
</html>
