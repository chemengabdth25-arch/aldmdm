        :root {
            --primary: #1e3a8a;
            --secondary: #0ea5e9;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.7;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-align: center;
            padding: 2.2rem 1rem 1.8rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            position: relative;
        }
        .lang-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        [dir="ltr"] .lang-btn { left: auto; right: 15px; }
        .lang-btn:hover { background: rgba(255, 255, 255, 0.35); }

        header h1 { margin: 0; font-size: 2.3rem; font-weight: 800; }

        .container {

            margin: 1.8rem auto;
            padding: 0 1rem;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 1.6rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 1.5rem;
        }
        .tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            padding: 12px 10px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.25);
        }
        .upload-box {
            border: 2px dashed var(--secondary);
            border-radius: 12px;
            padding: 1.4rem;
            text-align: center;
            background: #f0f9ff;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-box:hover { background: #e0f2fe; }
        .file-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e3a8a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 8px;
        }
        textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            margin-top: 8px;
            margin-bottom: 1rem;
            background: white;
        }
        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .action-btn:hover { background: #172554; }
        .action-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .pdf-btn { background: #059669; flex: 1; min-width: 200px; }
        .pdf-btn:hover { background: #047857; }
        .copy-btn { background: #0284c7; flex: 1; min-width: 200px; }
